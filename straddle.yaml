# hw-heltecv4-r2 — board HAL straddle for the Heltec WiFi LoRa 32 V4 with the
# ESP32-S3R2 module (2 MB quad PSRAM). The same board with the S3R8 module
# (8 MB octal PSRAM) is hw-heltecv4-r8: the PSRAM mode is fixed at build time,
# and the R8 moves Vext to GPIO 40, so one image cannot serve both.
#
# A plain (non-buildable) board component: it doesn't decide what the device
# DOES, it only makes the board usable by an app. The reticulous/reticulous
# buildable adds it with `--with spangap/hw-heltecv4-r2` and inherits the
# board's pin map, bring-up hook and hardware kconfig.
#
# Owns the V4 R2 board HAL (esp-idf/src/heltecv4r2.cpp: the Vext peripheral
# power rail and the LoRa CS park). app_main, partitions, the OTA story and the
# browser SPA are NOT here — they belong to the buildable. Board reference:
# https://heltec.org/project/wifi-lora-32-v4/
#
# Wires LoRa, the Vext rail and the 0.96" SSD1306 OLED (via spangap/tinylcd —
# the OLED sits on the Vext rail, which onStart brings up first). No GNSS, no
# SD card — present on the board but left unwired. The colour-TFT UI
# (spangap-lcd) stays out: the OLED is tinylcd's mono paged UI, not LVGL.
schema_version: 1
name: spangap/hw-heltecv4-r2
prefix: heltecv4r2
firmware: esp-idf
version: 0.0.0
platforms: [idf]
# Board bring-up as a registered Service. app_main is generated by the buildable;
# it constructs Heltecv4R2Board and walks it. Heltecv4R2Board::onStart is
# bare-hardware (Vext power rail + LoRa CS park) and runs before spangapInit().
# No onInit — the OLED UI is tinylcd's own service, not a board hook.
services:
  - { class: Heltecv4R2Board, header: heltecv4r2.h }
# The board's screen is a mono OLED, so the board is what stages the paged
# OLED UI; the buildable stays display-agnostic (same pattern as the T-Deck
# staging spangap-lcd).
additional_installs:
  - spangap/tinylcd
  # The SX1262 is soldered to this board, so the board is what stages the LoRa
  # interface — and LoRaMon with it, which iface-lora pulls in. The radio rides
  # on the board for the same reason the screen does: a buildable stays
  # radio-agnostic, and a board with no modem ships no LoRa settings at all.
  # Gated on rns, because it is a Reticulum interface: a buildable that is not a
  # Reticulum node must not inherit the mesh from the board's modem.
  - { install: reticulous/iface-lora, when: reticulous/rns }
# Board VALUES, fed to the symbols other straddles / IDF DEFINE through the
# collected staging/sdkconfig.spangap-fragments. A board straddle is non-
# buildable, so its sdkconfig.defaults would be IGNORED — everything that
# describes this hardware MUST live here in kconfig: to survive `--with`.
kconfig:
  # Board memory: 16 MB flash, 2 MB *quad* PSRAM (ESP32-S3R2). Unlike the
  # T-Deck's or the V4 R8's S3R8 (8 MB octal), the R2 carries only 2 MB in QUAD
  # mode — so SPIRAM_MODE_QUAD, not _OCT. The platform's "octal PSRAM"
  # assumption does not hold on this board; watch DRAM/PSRAM headroom.
  - CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
  # State floor = the offset where the runtime read-write /state partition
  # begins; /state then fills the rest of the real 16 MB chip. WITHOUT this the
  # floor defaults to the whole flash container, so `app` expands to fill all
  # 16 MB and NO /state partition exists (the device has nowhere to store user
  # data). 6 MB = the headless app+fixed (~2.8 MB) plus ~3 MB of growth headroom;
  # /state gets the remaining ~10 MB. Changing this relocates /state → existing
  # devices factory-reset on the next boot, so warn users before bumping it.
  - CONFIG_SPANGAP_MAX_FIRMWARE_KB=6144
  - CONFIG_SPIRAM_MODE_QUAD=y
  # One SX1262 LoRa modem on its own SPI bus (separate from the flash bus).
  # Pins per the Heltec WiFi LoRa 32 V4 pin map. The SX1262 drives DIO2 as its
  # own RF antenna switch and DIO3 supplies the 1.8 V TCXO.
  # Gated on iface-lora: the CONFIG_LORA_* symbols are DEFINED by that
  # straddle's Kconfig, so applying these in a build without it would warn as
  # unknown symbols.
  - when: reticulous/iface-lora
    set:
      - CONFIG_LORA_COUNT=1
      - CONFIG_LORA_SPI_HOST=2
      - CONFIG_LORA_SCK_PIN=9
      - CONFIG_LORA_MOSI_PIN=10
      - CONFIG_LORA_MISO_PIN=11
      - CONFIG_LORA0_CS_PIN=8
      - CONFIG_LORA0_DIO1_PIN=14
      - CONFIG_LORA0_BUSY_PIN=13
      - CONFIG_LORA0_RST_PIN=12
      - CONFIG_LORA0_TCXO_MV=1800
      - CONFIG_LORA0_DIO2_RF_SWITCH=y
      - CONFIG_LORA0_RADIO_SX1262=y
      # External FEM (PA/LNA/switch) between the SX1262 and the antenna — this
      # is what takes the board to 27 dBm. Two parts exist across board
      # revisions (GC1109 on <= 4.2, KCT8103L on 4.3) sharing the rail (GPIO 7)
      # and the shutdown net CSD (GPIO 2, pulled up to the FEM rail only in the
      # KCT8103L design — the boot-time detect sense). The second control line
      # differs in signal as well as pin: on <= 4.2 GPIO 46 is CPS, the
      # PA/transmit-bypass select, with the TX/RX direction line CTX coming off
      # the radio's DIO2; on 4.3 GPIO 5 is CTX itself and CPS has no MCU
      # connection. iface-lora detects the part and drives the right one. See
      # iface-lora's lora_fem.h.
      - CONFIG_LORA0_FEM_PWR_PIN=7
      - CONFIG_LORA0_FEM_EN_PIN=2
      - CONFIG_LORA0_FEM_TXSEL_A_PIN=46
      - CONFIG_LORA0_FEM_TXSEL_B_PIN=5
      # The FEM ceiling at the antenna — a board rating, which caps whatever the
      # calibration below says the hardware reaches.
      - CONFIG_LORA_TX_POWER_MAX=27
  # What the board actually radiates at the connector for a given register
  # setting. Both parts amplify hard enough that the register number means
  # nothing on its own: at the bottom of the range this board's quietest
  # transmission is +7 dBm however low the radio is driven, so a node that
  # announced the register figure would be understating its power by some 16 dB
  # and every peer would compute its path loss wrong by the same amount.
  #
  # gc1109 (rev <= 4.2) is measured — tinySA Ultra Plus with a 30 dB pad at
  # 869.6 MHz, +-1 dB, from MeshCore issue 1708. Note the turnover at the top:
  # 20 gives more than 22 does, so max power is reached at 20 and asking for 22
  # buys 136 mA and nothing else.
  #
  # kct8103l (rev 4.3) has no published measurement. It is datasheet
  # arithmetic: the 17 dB pad ahead of the part, its 32 dB transmit gain, and
  # the board's own 27 dBm rating for the saturation it does not publish. Grade
  # says so, and a measured curve should replace it.
  - when: reticulous/iface-lora
    set:
      - 'CONFIG_LORA0_TX_CAL="gc1109 measured 1:7,5:12,10:20,12:23,14:24,16:25,18:27,20:28,22:27;kct8103l datasheet -9:6,12:27,22:27"'
  # 0.96" SSD1306 128x64 OLED on I2C (SDA 17 / SCL 18, reset on 21), powered
  # off the Vext rail Heltecv4R2Board::onStart() enables. BOOT/PRG button (GPIO 0)
  # advances the page. Gated: without tinylcd staged these symbols don't exist.
  - when: spangap/tinylcd
    set:
      - CONFIG_TINYLCD_SDA_PIN=17
      - CONFIG_TINYLCD_SCL_PIN=18
      - CONFIG_TINYLCD_RST_PIN=21
      - CONFIG_TINYLCD_BUTTON_PIN=0
      # Page dots default to "top unless flipped": the PRG button sits above
      # the screen in orientation 0, and the dots track it through a flip.
      - CONFIG_TINYLCD_PAGE_INDICATOR=2
